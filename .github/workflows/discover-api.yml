name: Sync Discovered API with APIConnect

on: [pull_request, workflow_dispatch, push]

env:
  API_HOST: env5717743.a-vir-c1.apiconnect.ipaas.automation.ibm.com
  PROVIDER_ORG: env5717743
  API_FILES: test-api.yaml

jobs:
  run-discovery:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Push API to Discovery via Force-CURL
      run: |
        echo "Bypass SSL and Sending ${{ env.API_FILES }}..."
        
        # Kita bungkus file jadi base64 agar aman di JSON
        FILE_CONTENT=$(cat ${{ env.API_FILES }} | base64 -w 0)
        
        curl --location --request POST "https://${{ env.API_HOST }}/platform-api/orgs/${{ env.PROVIDER_ORG }}/discovery/github" \
          --insecure \
          --header "Authorization: Bearer ${{ secrets.apicApikey }}" \
          --header "Content-Type: application/json" \
          --data "{
            \"api_files\": [\"$FILE_CONTENT\"],
            \"resync_check\": true
          }"
          
    - name: Final Check
      run: echo "Jika CURL di atas 200/201 OK, langsung cek menu Discover > Sources!"
