name: Audit Izin API Connect Final

on: [push, workflow_dispatch]

jobs:
  audit-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Tes Koneksi & Token IAM
        id: iam_token
        env:
          # PAKAI NAMA SECRET BARU ANDA DI SINI
          API_KEY: ${{ secrets.APIC_APIKEY_ANDIKA_2026 }}
        run: |
          echo "### MENGECEK VALIDITAS API KEY BARU ###"
          RESPONSE=$(curl -s -X POST "https://iam.cloud.ibm.com/identity/token" \
               -H "Content-Type: application/x-www-form-urlencoded" \
               -d "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=$API_KEY")
          
          if echo "$RESPONSE" | grep -q "access_token"; then
            echo "✅ API Key Valid: Berhasil login ke IBM Cloud."
          else
            echo "❌ API Key TIDAK VALID: Cek penulisan Secret APIC_APIKEY_ANDIKA_2026."
            echo "$RESPONSE" | jq .
            exit 1
          fi

      - name: 2. Audit Akses Org & Katalog
        env:
          API_KEY: ${{ secrets.APIC_APIKEY_ANDIKA_2026 }}
          ORG: env5717743
          SERVER: platform-api.us-east-a.apiconnect.automation.ibm.com
        run: |
          # Ambil Token IAM
          TOKEN=$(curl -s -X POST "https://iam.cloud.ibm.com/identity/token" \
               -H "Content-Type: application/x-www-form-urlencoded" \
               -d "grant_type=urn:ibm:params:oauth:grant-type:apikey&apikey=$API_KEY" | jq -r .access_token)

          echo -e "\n### 2a. MENGECEK AKSES ORGANISASI ($ORG) ###"
          ORG_CHECK=$(curl -s -X GET "https://$SERVER/api/orgs/$ORG" \
               -H "Authorization: Bearer $TOKEN" \
               -H "Accept: application/json")
          
          if echo "$ORG_CHECK" | grep -q "\"name\""; then
            echo "✅ Akses Org Berhasil!"
            echo "$ORG_CHECK" | jq -r '"Organisasi: " + .title'
          else
            echo "❌ Akses Org Gagal: Anda mungkin tidak punya izin di level Org ini."
            echo "$ORG_CHECK" | jq .
          fi

          echo -e "\n### 2b. MENGECEK AKSES KATALOG (SANDBOX) ###"
          CAT_CHECK=$(curl -s -X GET "https://$SERVER/api/orgs/$ORG/catalogs" \
               -H "Authorization: Bearer $TOKEN" \
               -H "Accept: application/json")
          
          if echo "$CAT_CHECK" | grep -q "\"name\""; then
            echo "✅ Akses Katalog Berhasil!"
            echo "Katalog yang ditemukan:"
            echo "$CAT_CHECK" | jq -r '.results[].title'
          else
            echo "❌ Akses Katalog Gagal."
            echo "$CAT_CHECK" | jq .
          fi
