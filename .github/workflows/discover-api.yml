name: Sync Discovered API via CURL

on: [push, workflow_dispatch]

env:
  API_HOST: env5717743.a-vir-c1.apiconnect.ipaas.automation.ibm.com
  PROVIDER_ORG: env5717743
  API_FILE: api-demo.yaml # Pastikan file ini ada di repo GitHub Bapak

jobs:
  manual-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push API to IBM Discovery via CURL
        run: |
          echo "Sending $API_FILE to IBM Cloud..."
          curl --location --request POST "https://${{ env.API_HOST }}/platform-api/orgs/${{ env.PROVIDER_ORG }}/discovery/github" \
          --insecure \
          --header "Authorization: Bearer ${{ secrets.apicApikey }}" \
          --header "Content-Type: application/json" \
          --data "{
            \"api_files\": [\"$(cat ${{ env.API_FILE }} | base64 -w 0)\"],
            \"resync_check\": true
          }"
          
      - name: Check Status
        run: echo "Proses selesai. Silakan cek menu Discover di APIC."
