name: Audit Izin API Connect

on: [push, workflow_dispatch]

jobs:
  audit-permissions:
    runs-on: ubuntu-latest
    steps:
      - name: Audit Akses Org & Katalog
        env:
          API_KEY: ${{ secrets.apicApikey2 }}
          ORG: env5717743
          SERVER: platform-api.us-east-a.apiconnect.automation.ibm.com
        run: |
          echo "### 1. MENGECEK AKSES ORGANISASI ###"
          # Perintah ini akan gagal jika Anda bukan Org Admin/Owner
          curl -s -X GET "https://$SERVER/api/orgs/$ORG" \
               -H "Authorization: Bearer $API_KEY" \
               -H "Accept: application/json" | grep -E "name|title|error" || echo "Akses Org Gagal/Kosong"

          echo -e "\n### 2. MENGECEK AKSES KATALOG (SANDBOX) ###"
          # Perintah ini akan berhasil jika Anda minimal punya akses Developer di Katalog
          curl -s -X GET "https://$SERVER/api/orgs/$ORG/catalogs" \
               -H "Authorization: Bearer $API_KEY" \
               -H "Accept: application/json" | grep -E "name|title|error" || echo "Akses Katalog Gagal"
