name: Test APIC Connection

on: [push, workflow_dispatch]

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Install APIC CLI
        run: |
          curl -LO https://itpro-apic-production.s3.us-east.cloud-object-storage.appdomain.cloud/apic-linux-amd64
          chmod +x apic-linux-amd64
          sudo mv apic-linux-amd64 /usr/local/bin/apic

      - name: Check My Access
        env:
          SERVER: us-east-a.apiconnect.automation.ibm.com
          API_KEY: ${{ secrets.apicApikey }}
        run: |
          # Login
          apic login --server $SERVER --sso --apiKey $API_KEY
          
          # Lihat daftar organisasi yang bisa diakses oleh Kunci ini
          echo "--- DAFTAR ORGANISASI ANDA ---"
          apic orgs:list --server $SERVER --sso --apiKey $API_KEY
