name: Sync Discovered API with APIConnect

on: 
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main  # Atau sesuaikan dengan branch utama kamu

env:
  # Host untuk iPaaS Sydney biasanya menggunakan prefix 'api' atau langsung domain manager
  API_HOST: api.a-syd-c1.apiconnect.ipaas.automation.ibm.com
  PLATFORM_API_PREFIX: platform-api
  PROVIDER_ORG: dev4501662
  API_FILES: api-test.yaml
  # Memaksa penggunaan Node 24 untuk menghindari warning deprecation
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Bypass validasi TLS di level Node.js untuk menangani SSL Alert 40
  NODE_TLS_REJECT_UNAUTHORIZED: 0

jobs:
  run-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Penting agar git diff bisa bekerja

      - name: Calculate Git Diff
        id: difference-output
        run: |
          # Logika untuk mendapatkan file yang berubah
          PREV_SHA=${{ github.event.before }}
          if [ "$PREV_SHA" == "0000000000000000000000000000000000000000" ] || [ -z "$PREV_SHA" ]; then
            PREV_SHA="HEAD~1"
          fi
          DIFF=$(git diff --name-only --diff-filter=ACMRT $PREV_SHA ${{ github.sha }} | xargs)
          echo "action_updates=$DIFF" >> $GITHUB_OUTPUT

      - name: Run APIC Discovery
        uses: ibm-apiconnect/apic-discovery-action@main
        id: discover-apis
        with:
          api_host: ${{ env.API_HOST }}
          platform_api_prefix: ${{ env.PLATFORM_API_PREFIX }}
          provider_org: ${{ env.PROVIDER_ORG }}
          api_key: ${{ secrets.Key_api }}
          api_files: ${{ env.API_FILES }}
          resync_check: true
          git_diff: ${{ steps.difference-output.outputs.action_updates }}
          # Bypass SSL di level Action
          insecure_skip_tls_verify: true

      - name: Display Result
        if: always() # Tetap munculkan hasil meskipun step sebelumnya error
        run: |
          echo "Result of the action: ${{ steps.discover-apis.outputs.action-result }}"
          echo "Process Finished"
