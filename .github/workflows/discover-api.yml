- name: Get Access Token & Push API
        env:
          MY_API_KEY: ${{ secrets.APIC_APIKEY_ANDIKA_2026 }}
          ORG: env5717743
          SERVER: platform-api.us-east-a.apiconnect.automation.ibm.com
          FILE_PATH: "path/ke/file/api_anda.json" 
        run: |
          echo "### STEP 1: LOGIN ###"
          
          # Kita buat file json sementara agar pengiriman datanya 'aman'
          cat <<EOF > login_data.json
          {
            "api_key": "$MY_API_KEY",
            "grant_type": "api_key",
            "client_id": "149625d1-de09-46e1-903a-3c0957097c2f",
            "client_secret": "3d7e8f4f-d562-40ce-88de-a656f6b13f9e"
          }
          EOF

          # Kirim menggunakan file tersebut
          RESPONSE=$(curl -s -X POST "https://$SERVER/api/token" \
               -H "Content-Type: application/json" \
               -H "Accept: application/json" \
               -d @login_data.json)

          TOKEN=$(echo $RESPONSE | jq -r .access_token)

          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "❌ Login Gagal! Respons server:"
            echo "$RESPONSE" | jq .
            exit 1
          fi
          echo "✅ Login Berhasil. Token didapatkan."

          # Lanjutkan ke Step Upload (sama seperti sebelumnya)
          echo "### STEP 2: UPLOAD ###"
          # ... rest of your upload script ...
