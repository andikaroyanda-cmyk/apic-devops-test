name: Sync Discovered API via CURL

on: [push, workflow_dispatch]

env:
  API_HOST: env5717743.a-vir-c1.apiconnect.ipaas.automation.ibm.com
  PROVIDER_ORG: env5717743
  API_FILE: test-api.yaml # Pastikan nama file ini persis (cek besar kecil hurufnya)

jobs:
  manual-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push API to IBM Discovery
        run: |
          echo "Sending ${{ env.API_FILE }} to IBM Cloud..."
          # Kita pakai -F (form-data) karena biasanya endpoint discovery lebih stabil terima file asli
          curl --location --request POST "https://${{ env.API_HOST }}/platform-api/orgs/${{ env.PROVIDER_ORG }}/discovery/github" \
          --insecure \
          --header "Authorization: Bearer ${{ secrets.apicApikey }}" \
          --form "api_files=@${{ env.API_FILE }}" \
          --form "resync_check=true"
          
      - name: Check Status
        run: echo "Proses selesai. Silakan refresh halaman Discover di APIC."
